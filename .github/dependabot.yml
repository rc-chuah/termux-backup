version: 2
updates:
  # Maintain dependencies for Rust crates
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "11:00"
      timezone: "UTC"
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "11:00"
      timezone: "UTC"
    groups:
      github-actions:
        patterns:
          - "*"
