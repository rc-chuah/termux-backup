name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.abi }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
            clang: aarch64-linux-android21-clang
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
            clang: armv7a-linux-androideabi21-clang
          - target: i686-linux-android
            abi: x86
            clang: i686-linux-android21-clang
          - target: x86_64-linux-android
            abi: x86_64
            clang: x86_64-linux-android21-clang
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          save-if: true

      - name: Build release binary
        run: |
          TARGET="${{ matrix.target }}"
          CLANG="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.clang }}"
          AR_TOOL="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          TARGET_UPPER=$(echo "$TARGET" | tr '[:lower:]-' '[:upper:]_')

          export "CARGO_TARGET_${TARGET_UPPER}_LINKER=$CLANG"
          export "CC_${TARGET_UPPER}=$CLANG"
          export "AR_${TARGET_UPPER}=$AR_TOOL"

          cargo build --release --target "$TARGET" --verbose

      - name: Package tar.gz archive and checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_NAME="termux-backup-${VERSION}-${{ matrix.target }}.tar.gz"
          tar -czvf "${ARCHIVE_NAME}" -C "target/${{ matrix.target }}/release" termux-backup
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.abi }}
          path: |
            termux-backup-*-${{ matrix.target }}.tar.gz
            termux-backup-*-${{ matrix.target }}.tar.gz.sha256

  publish_release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/*.tar.gz

      - name: Scan release artifacts on VirusTotal
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: |
            artifacts/*.tar.gz
          update_release_body: true

  publish_crates_io:
    name: Publish to crates.io
    needs: publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          NAME=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if cargo info "${NAME}@${VERSION}" >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already published on crates.io, skipping."
          else
            cargo publish --verbose
          fi
