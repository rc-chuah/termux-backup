name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.abi }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
            deb_arch: aarch64
            clang: aarch64-linux-android21-clang
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
            deb_arch: arm
            clang: armv7a-linux-androideabi21-clang
          - target: i686-linux-android
            abi: x86
            deb_arch: i686
            clang: i686-linux-android21-clang
          - target: x86_64-linux-android
            abi: x86_64
            deb_arch: x86_64
            clang: x86_64-linux-android21-clang
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          save-if: true

      - name: Build release binary
        run: |
          TARGET="${{ matrix.target }}"
          CLANG="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.clang }}"
          AR_TOOL="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          TARGET_UPPER=$(echo "$TARGET" | tr '[:lower:]-' '[:upper:]_')

          export "CARGO_TARGET_${TARGET_UPPER}_LINKER=$CLANG"
          export "CC_${TARGET_UPPER}=$CLANG"
          export "AR_${TARGET_UPPER}=$AR_TOOL"

          cargo build --release --target "$TARGET" --verbose

      - name: Package tar.gz archive and checksum
        run: |
          ARCHIVE_NAME="termux-backup-${{ matrix.target }}.tar.gz"
          tar -czvf "${ARCHIVE_NAME}" -C "target/${{ matrix.target }}/release" termux-backup
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

      - name: Build Termux .deb package and checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DEB_ARCH="${{ matrix.deb_arch }}"
          PKG_DIR="pkg-deb-${DEB_ARCH}"
          DEB_NAME="termux-backup_${VERSION}_${DEB_ARCH}.deb"

          mkdir -p "${PKG_DIR}/DEBIAN"
          mkdir -p "${PKG_DIR}/data/data/com.termux/files/usr/bin"

          install -m 0755 "target/${{ matrix.target }}/release/termux-backup" \
            "${PKG_DIR}/data/data/com.termux/files/usr/bin/termux-backup"

          cat > "${PKG_DIR}/DEBIAN/control" <<EOF
          Package: termux-backup
          Version: ${VERSION}
          Architecture: ${DEB_ARCH}
          Maintainer: "RC Chuah-(RaynerSec)" <44928288+rc-chuah@users.noreply.github.com>
          Depends: tar, gzip
          Section: utils
          Priority: optional
          Homepage: https://github.com/rc-chuah/termux-backup
          Description: A Rust program to backup and restore your Termux home and sysroot directories.
          EOF

          dpkg-deb --build --root-owner-group "${PKG_DIR}" "${DEB_NAME}"
          sha256sum "${DEB_NAME}" > "${DEB_NAME}.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.abi }}
          path: |
            termux-backup-${{ matrix.target }}.tar.gz
            termux-backup-${{ matrix.target }}.tar.gz.sha256
            termux-backup_*_${{ matrix.deb_arch }}.deb
            termux-backup_*_${{ matrix.deb_arch }}.deb.sha256

  publish_release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.sha256

  publish_crates_io:
    name: Publish to crates.io
    needs: publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        run: cargo publish --verbose
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
