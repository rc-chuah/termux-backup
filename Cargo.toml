[package]
name = "termux-backup"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["RC Chuah-(RaynerSec)", "Zongou"]
description = "A Rust program to backup and restore your Termux home and sysroot directories."
documentation = "https://docs.rs/termux-backup"
homepage = "https://rc-chuah.is-a.dev/termux-backup/"
repository = "https://github.com/rc-chuah/termux-backup"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["termux", "backup", "restore", "android", "archive"]
categories = ["command-line-utilities"]

[[bin]]
name = "termux-backup"
path = "src/main.rs"

[dependencies]
tar = "0.4"
sha2 = "0.10"
flate2 = "1.0"

[profile.dev]
opt-level = 0
debug = true
strip = "none"
lto = false
panic = "unwind"
codegen-units = 256
overflow-checks = true

[profile.release]
opt-level = 3
debug = false
strip = true
lto = true
panic = "abort"
codegen-units = 1
overflow-checks = false

[profile.test]
opt-level = 0
debug = true
lto = false
codegen-units = 16

[profile.bench]
opt-level = 3
debug = false
lto = true
codegen-units = 1

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "i686-linux-android",
    "x86_64-linux-android",
]
rustdoc-args = ["--cfg", "docsrs"]
